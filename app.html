<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSC Vocabulary AI</title>
<style>
:root{--bg:#070a12;--panel:#111827;--panel2:#151c2d;--line:#273149;--text:#f7f8fc;--muted:#8995ad;--purple:#7657ff;--green:#32d583}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 550px at 70% -10%,#3a267044,transparent 60%),var(--bg);color:var(--text);font:14px/1.55 Inter,system-ui,sans-serif}.app{min-height:100vh;display:flex}.side{position:fixed;left:0;top:0;bottom:0;width:250px;padding:22px 15px;background:#090d17ee;border-right:1px solid var(--line)}.logo{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:900;padding:5px 10px 28px}.mark{width:35px;height:35px;border-radius:11px;background:linear-gradient(135deg,#8062ff,#5435d0);display:grid;place-items:center}.logo b{color:#a18bff}.label{font-size:10px;color:#59657d;letter-spacing:1.5px;text-transform:uppercase;padding:0 12px 8px}.nav{display:grid;gap:5px}.nav button{width:100%;border:1px solid transparent;background:transparent;color:#8792aa;text-align:left;padding:12px;border-radius:11px;cursor:pointer;font:inherit}.nav button.active,.nav button:hover{background:var(--panel2);color:#fff;border-color:#29334b}.user{position:absolute;left:15px;right:15px;bottom:18px;padding:11px;border:1px solid var(--line);background:var(--panel);border-radius:12px}.main{margin-left:250px;width:calc(100% - 250px);max-width:1450px;padding:28px 38px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.ey{font-size:10px;color:#7e8aa2;text-transform:uppercase;letter-spacing:1.5px}.top h1{font-size:28px;margin:2px 0;letter-spacing:-.7px}.btn{border:1px solid var(--line);background:var(--panel2);color:#fff;padding:11px 15px;border-radius:10px;cursor:pointer}.primary{border:0;background:linear-gradient(135deg,#8062ff,#6847e8);font-weight:800}.badge{padding:6px 10px;border-radius:999px;background:#171f31;border:1px solid var(--line);color:#aeb8cb;font-size:11px}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:linear-gradient(145deg,#111827,#0e1422);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 18px 55px #0005}.stat strong{display:block;font-size:29px;margin-top:7px}.layout{display:grid;grid-template-columns:1.45fr .85fr;gap:16px;margin-top:16px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.head h2{font-size:17px;margin:0}.progress{height:7px;background:#1a2132;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:33%;background:linear-gradient(90deg,#7454ff,#a283ff)}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.quick button{border:1px solid var(--line);background:#131a2b;color:#fff;border-radius:12px;padding:14px;text-align:left;cursor:pointer}.quick b{display:block}.quick small{color:var(--muted)}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:6px 9px;border-radius:999px;background:#1a2235;border:1px solid #283149;color:#c4cede;font-size:11px}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #20283a}.row:last-child{border:0}.flash{max-width:900px;margin:auto}.flashcard{background:linear-gradient(150deg,#151c2d,#0d1320);border:1px solid #303a55;border-radius:22px;padding:28px;box-shadow:0 30px 90px #0009}.word{font-size:58px;font-weight:900;letter-spacing:-2px;margin:25px 0 4px}.pron{color:#a895ff}.recall{margin-top:25px;border:1px dashed #35415c;border-radius:13px;padding:14px}.answer{display:none;margin-top:20px}.answer.show{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.info{background:#131b2c;border:1px solid var(--line);border-radius:12px;padding:14px}.info h3{margin:0 0 6px;font-size:11px;color:#9ba7bb;text-transform:uppercase;letter-spacing:.7px}.info p{margin:0}.story{background:linear-gradient(135deg,#211c42,#15182a);border-color:#3b3264}.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}.rate button{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:#fff;cursor:pointer}.form{display:grid;gap:12px}.form label{display:grid;gap:7px;color:#9aa6bb;font-size:12px}.form input,.form textarea{background:#0b111d;border:1px solid var(--line);color:#fff;border-radius:10px;padding:12px;width:100%;font:inherit}.form textarea{min-height:145px}.hidden{display:none!important}
@media(max-width:900px){.side{width:72px}.logoText,.label,.nav span,.user{display:none}.logo{justify-content:center}.nav button{text-align:center}.main{margin-left:72px;width:calc(100% - 72px);padding:22px}.stats,.layout{grid-template-columns:1fr 1fr}}@media(max-width:600px){.side{display:none}.main{margin:0;width:100%;padding:16px}.stats,.quick,.grid,.rate{grid-template-columns:1fr}.word{font-size:44px}.top h1{font-size:22px}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="logo"><div class="mark">S</div><div class="logoText">SSC <b>Vocab AI</b></div></div><div class="label">Workspace</div><nav class="nav"><button data-page="dashboard" class="active">⌂ <span>Dashboard</span></button><button data-page="learn">◈ <span>Learn Words</span></button><button data-page="words">☷ <span>My Vocabulary</span></button><button data-page="quiz">✓ <span>SSC Quiz</span></button><button data-page="settings">⚙ <span>AI Settings</span></button></nav><div class="user"><b>Purendar</b><div class="muted" style="font-size:11px">SSC CGL · AI Study</div></div></aside>
<main class="main"><div id="page"></div></main>
</div>
<script>
const words=[
{w:'Guile',p:'/ɡaɪl/',pos:'noun',en:'Sly or cunning intelligence used to deceive or trick someone.',hi:'छल-कपट / चालाकी',hg:'Chalaki se kisi ko trick ya deceive karna.',mn:'GUY + चालाक smile = GUILE',st:'Imagine a GUY with a clever smile secretly tricking everyone to win a prize.',core:'Clever deception',sy:['cunning','craft','deceit'],an:['honesty','sincerity'],ex:'He relied on guile rather than force.',cf:['Guilt','Gullible']},
{w:'Abate',p:'/əˈbeɪt/',pos:'verb',en:'To become less strong, intense, or severe.',hi:'कम होना / घटाना',hg:'Intensity ya strength ka kam ho jana.',mn:'A BEAR says: ABATE the storm!',st:'A huge BEAR roars at a storm and makes it weak — the storm ABATES.',core:'Become less intense',sy:['lessen','diminish','subside'],an:['increase','intensify'],ex:'The heavy rain began to abate.',cf:['Abet','Abdicate']},
{w:'Benevolent',p:'/bəˈnevələnt/',pos:'adjective',en:'Kind, generous and willing to help others.',hi:'दयालु / परोपकारी',hg:'Dusron ki help aur bhalaai karne wala.',mn:'BEN + VOLUNTEER = BENEVOLENT',st:'BEN becomes a volunteer and gives gifts to everyone — he is BENEVOLENT.',core:'Kind and generous',sy:['kind','charitable','generous'],an:['cruel','malevolent'],ex:'The benevolent officer helped the poor.',cf:['Malevolent','Beneficial']}
];
let index=0, learned=0, correct=0, wrong=0;
const page=document.getElementById('page');
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function top(title,ey,right){return '<div class="top"><div><div class="ey">'+ey+'</div><h1>'+title+'</h1></div>'+(right||'')+'</div>'}
function show(name){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===name));({dashboard,learn,words,quiz,settings}[name]||dashboard)()}
function dashboard(){const n=words.length;page.innerHTML=top('Vocabulary Dashboard','SSC English','<button class="btn primary" id="start">+ Start Learning</button>')+'<div class="stats"><div class="card stat"><span class="muted">Total Words</span><strong>'+n+'</strong><span class="muted">Vocabulary bank</span></div><div class="card stat"><span class="muted">Mastered</span><strong>'+learned+'</strong><span class="muted">Active recall</span></div><div class="card stat"><span class="muted">Needs Revision</span><strong>'+wrong+'</strong><span class="muted">Priority words</span></div><div class="card stat"><span class="muted">Study Streak</span><strong>'+correct+'</strong><span class="muted">Correct answers</span></div></div><div class="layout"><div class="card"><div class="head"><div><h2>Continue Learning</h2><span class="muted">Spaced repetition · active recall</span></div><span class="badge">'+Math.round(learned/n*100)+'%</span></div><div style="display:flex;justify-content:space-between;margin:20px 0 8px"><b>Vocabulary mastery</b><span class="muted">'+learned+'/'+n+'</span></div><div class="progress"><i style="width:'+Math.round(learned/n*100)+'%"></i></div><div class="quick"><button data-go="learn"><b>Flashcards</b><small>Meaning + mnemonic</small></button><button data-go="quiz"><b>SSC Quiz</b><small>MCQ practice</small></button><button data-go="words"><b>Add Words</b><small>Build your bank</small></button></div></div><div class="card"><div class="head"><h2>Today's Focus</h2><span class="badge">AI Ready</span></div><p class="muted">Words you miss return sooner. Strengthen difficult words with AI-generated memory tricks.</p><div class="chips"><span class="chip">Active Recall</span><span class="chip">Spaced Repetition</span><span class="chip">Hindi + Hinglish</span><span class="chip">SSC MCQ</span><span class="chip">Confusion Words</span></div></div></div><div class="card" style="margin-top:16px"><div class="head"><h2>Recent Vocabulary</h2><button class="btn" data-go="words">View all</button></div>'+words.map(function(x){return '<div class="row"><div><b>'+esc(x.w)+'</b><div class="muted">'+esc(x.hi)+'</div></div><span class="badge">Ready</span></div>'}).join('')+'</div>';wireGo();document.getElementById('start').onclick=function(){show('learn')}}
function learn(){const x=words[index%words.length];page.innerHTML=top('Active Recall','LEARN WORDS','<span class="badge">'+(index%words.length+1)+' / '+words.length+'</span>')+'<div class="flash"><div class="flashcard"><div class="head"><span class="badge">'+esc(x.pos)+'</span><span class="muted">Recall before reveal</span></div><div class="word">'+esc(x.w)+'</div><div class="pron">'+esc(x.p)+'</div><div class="recall"><b>Can you recall?</b><div class="muted">Meaning · synonym · antonym · memory trick · example</div></div><button class="btn primary" id="reveal" style="width:100%;margin-top:14px">Reveal Answer</button><div id="answer" class="answer"><div class="grid"><div class="info"><h3>Simple English</h3><p>'+esc(x.en)+'</p></div><div class="info"><h3>Hindi Meaning</h3><p>'+esc(x.hi)+'</p></div><div class="info"><h3>Hinglish</h3><p>'+esc(x.hg)+'</p></div><div class="info"><h3>Core Idea</h3><p><b>'+esc(x.core)+'</b></p></div><div class="info story"><h3>Phonetic Mnemonic</h3><p>'+esc(x.mn)+'</p></div><div class="info story"><h3>Visual Memory Story</h3><p>'+esc(x.st)+'</p></div><div class="info"><h3>Synonyms</h3><div class="chips">'+x.sy.map(function(a){return '<span class="chip">'+esc(a)+'</span>'}).join('')+'</div></div><div class="info"><h3>Antonyms</h3><div class="chips">'+x.an.map(function(a){return '<span class="chip">'+esc(a)+'</span>'}).join('')+'</div></div><div class="info"><h3>SSC Sentence</h3><p>'+esc(x.ex)+'</p></div><div class="info"><h3>Confusion Words</h3><div class="chips">'+x.cf.map(function(a){return '<span class="chip">'+esc(a)+'</span>'}).join('')+'</div></div></div><div class="rate"><button id="again">↻ Again · Today</button><button id="difficult">⚡ Difficult · Tomorrow</button><button id="got">✓ Got it · 3 days</button></div></div></div></div>';document.getElementById('reveal').onclick=function(){document.getElementById('answer').classList.add('show');this.classList.add('hidden')};document.getElementById('again').onclick=function(){wrong++;index++;learn()};document.getElementById('difficult').onclick=function(){index++;learn()};document.getElementById('got').onclick=function(){correct++;learned=Math.min(words.length,learned+1);index++;learn()}}
function words(){page.innerHTML=top('My Vocabulary','VOCABULARY BANK')+'<div class="card form"><label>Paste one or many words<textarea id="newwords" placeholder="abate\naberration\nbenevolent\nguile"></textarea></label><button class="btn primary" id="add">Add to Vocabulary</button></div><div class="card" style="margin-top:16px">'+words.map(function(x){return '<div class="row"><div><b>'+esc(x.w)+'</b><div class="muted">'+esc(x.hi)+' · '+esc(x.en)+'</div></div><span class="badge">Ready</span></div>'}).join('')+'</div>';document.getElementById('add').onclick=function(){const v=document.getElementById('newwords').value.trim();if(!v)return;v.split(/[\n,]+/).map(function(s){return s.trim()}).filter(Boolean).forEach(function(w){words.push({w:w,p:'',pos:'word',en:'Meaning will be generated by AI.',hi:'Hindi meaning pending',hg:'',mn:'AI mnemonic pending',st:'AI visual story pending',core:'',sy:[],an:[],ex:'',cf:[]})});words()}}
function quiz(){const x=words[index%words.length];const opts=[x.en].concat(words.filter(function(a){return a!==x}).slice(0,3).map(function(a){return a.en}));while(opts.length<4)opts.push('Another meaning');opts.sort(function(){return Math.random()-.5});page.innerHTML=top('SSC Practice Quiz','EXAM MODE','<span class="badge">CGL · Meaning</span>')+'<div class="flash"><div class="card"><div class="ey">Question 01</div><div style="font-size:24px;font-weight:800;margin:10px 0 20px">What does <span style="color:#a895ff">'+esc(x.w)+'</span> mean?</div>'+opts.map(function(a,i){return '<button class="btn option" data-correct="'+(a===x.en)+'" style="display:block;width:100%;text-align:left;margin:9px 0">'+String.fromCharCode(65+i)+' · '+esc(a)+'</button>'}).join('')+'</div></div>';document.querySelectorAll('.option').forEach(function(b){b.onclick=function(){if(b.dataset.correct==='true'){correct++;b.style.borderColor='var(--green)'}else{wrong++;b.style.borderColor='#ff5f79'}}})}
function settings(){page.innerHTML=top('AI Configuration','PROVIDER','<span class="badge">Stored locally</span>')+'<div class="card form"><label>Base URL<input id="base" value="https://router.bynara.id/v1"></label><label>API User<input id="apiuser" value="Purendar"></label><label>Model<input id="model" value="qwen3.8-27b"></label><label>API Key<input id="key" type="password" placeholder="Enter API key"></label><button class="btn primary" id="save">Save Configuration</button><button class="btn" id="test">Test Connection</button><p class="muted">Your API key stays in this browser. AI requests use the Vercel proxy.</p></div>';document.getElementById('save').onclick=function(){localStorage.setItem('ssc_api_key',document.getElementById('key').value);alert('AI configuration saved')};document.getElementById('test').onclick=function(){alert('Proxy is ready. Enter an API key and test again to contact the provider.')}}
function wireGo(){document.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){show(b.dataset.go)}})}
document.querySelectorAll('.nav button').forEach(function(b){b.onclick=function(){show(b.dataset.page)}});show('dashboard');
</script>
</body>
</html>
