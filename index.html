<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSC Vocabulary AI</title>
<style>
:root{--bg:#080b14;--panel:#111827;--panel2:#151d2e;--line:#29344c;--text:#f7f8fc;--muted:#8e9ab1;--purple:#7657ff;--green:#32d583;--red:#ff5f79}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 70% -10%,#3b267055,transparent 60%),var(--bg);color:var(--text);font:14px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}.app{min-height:100vh}.side{position:fixed;left:0;top:0;bottom:0;width:250px;padding:22px 15px;background:#090d17f2;border-right:1px solid var(--line)}.logo{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:900;padding:5px 10px 28px}.mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#8062ff,#5435d0)}.logo b{color:#a18bff}.label{font-size:10px;color:#59657d;letter-spacing:1.5px;text-transform:uppercase;padding:0 12px 8px}.nav{display:grid;gap:5px}.nav button{width:100%;border:1px solid transparent;background:transparent;color:#8994aa;text-align:left;padding:12px;border-radius:11px;font:inherit;cursor:pointer}.nav button:hover,.nav button.active{background:var(--panel2);color:#fff;border-color:var(--line)}.user{position:absolute;left:15px;right:15px;bottom:18px;padding:11px;border:1px solid var(--line);background:var(--panel);border-radius:12px}.main{margin-left:250px;padding:30px 38px 60px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.ey{font-size:10px;color:#7e8aa2;text-transform:uppercase;letter-spacing:1.5px}.top h1{font-size:28px;letter-spacing:-.7px;margin:2px 0}.muted{color:var(--muted)}.btn{border:1px solid var(--line);background:var(--panel2);color:#fff;padding:11px 15px;border-radius:10px;cursor:pointer;font-weight:600}.primary{border:0;background:linear-gradient(135deg,#8062ff,#6847e8);box-shadow:0 10px 25px #7657ff35}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#171f31;border:1px solid var(--line);color:#b4bed0;font-size:11px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid2{display:grid;grid-template-columns:1.45fr .85fr;gap:16px;margin-top:16px}.card{background:linear-gradient(145deg,#111827,#0e1422);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 18px 55px #0005}.stat strong{display:block;font-size:29px;margin:7px 0}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.head h2{font-size:17px;margin:0}.progress{height:7px;background:#1a2132;border-radius:99px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#7454ff,#a283ff)}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.quick button{border:1px solid var(--line);background:#131a2b;color:#fff;border-radius:12px;padding:14px;text-align:left;cursor:pointer}.quick b,.quick small{display:block}.quick small{color:var(--muted);margin-top:3px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:6px 9px;border-radius:999px;background:#1a2235;border:1px solid #283149;color:#c4cede;font-size:11px}.rows .row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #20283a}.rows .row:last-child{border:0}.flash{max-width:900px;margin:auto}.flashcard{background:linear-gradient(150deg,#151c2d,#0d1320);border:1px solid #303a55;border-radius:22px;padding:28px;box-shadow:0 30px 90px #0009}.word{font-size:58px;line-height:1;font-weight:900;letter-spacing:-2px;margin:25px 0 4px}.pron{color:#a895ff}.recall{margin:25px 0 14px;border:1px dashed #35415c;border-radius:13px;padding:14px}.hidden{display:none}.details{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:18px}.info{background:#131b2c;border:1px solid var(--line);border-radius:12px;padding:14px}.info h3{margin:0 0 6px;font-size:11px;color:#9ba7bb;text-transform:uppercase;letter-spacing:.7px}.info p{margin:0}.story{background:linear-gradient(135deg,#211c42,#15182a);border-color:#3b3264}.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}.rate button{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:#fff;cursor:pointer}.again{border-color:#633044!important}.got{border-color:#235c45!important;background:#11291f!important}.form{display:grid;gap:12px}.form label{display:grid;gap:7px;color:#9aa6bb;font-size:12px}.form input,.form textarea{background:#0b111d;border:1px solid var(--line);color:#fff;border-radius:10px;padding:12px;width:100%;font:inherit}.form textarea{min-height:150px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{display:block;width:100%;text-align:left;margin:9px 0;padding:14px;border:1px solid var(--line);background:#131a2a;color:#fff;border-radius:12px;cursor:pointer}.toast{position:fixed;right:20px;bottom:20px;background:#171f31;border:1px solid #33405c;padding:12px 16px;border-radius:11px}.error{margin:20px auto;max-width:700px;padding:18px;border:1px solid #633044;background:#21131c;border-radius:12px;color:#ffb4c0}@media(max-width:900px){.side{width:72px}.logo span,.label,.nav span,.user{display:none}.logo{justify-content:center}.nav button{text-align:center}.main{margin-left:72px;padding:22px}.grid4{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}@media(max-width:600px){.side{display:none}.main{margin:0;padding:16px}.grid4,.quick,.details,.two,.rate{grid-template-columns:1fr 1fr}.word{font-size:44px}.top h1{font-size:22px}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="logo"><div class="mark">S</div><span>SSC <b>Vocab AI</b></span></div><div class="label">Workspace</div><nav class="nav"><button data-page="dashboard" class="active">⌂ <span>Dashboard</span></button><button data-page="learn">◈ <span>Learn Words</span></button><button data-page="words">☷ <span>My Vocabulary</span></button><button data-page="quiz">✓ <span>SSC Quiz</span></button><button data-page="settings">⚙ <span>AI Settings</span></button></nav><div class="user"><b>Purendar</b><div class="muted" style="font-size:11px">SSC CGL · AI Study</div></div></aside>
<main class="main"><div id="page"></div></main></div><div id="toast" class="toast hidden"></div>
<script>
'use strict';
const DEFAULT_WORDS=[
{w:'Guile',p:'/ɡaɪl/',pos:'noun',en:'Sly or cunning intelligence used to deceive or trick someone.',hi:'छल-कपट / चालाकी',hg:'Chalaki se kisi ko trick ya deceive karna.',mn:'GUY + चालाक smile = GUILE',st:'Imagine a clever GUY secretly tricking everyone to win a prize.',core:'Clever deception',sy:['cunning','craft','deceit'],an:['honesty','sincerity'],ex:'He relied on guile rather than force.',cf:['Guilt','Gullible']},
{w:'Abate',p:'/əˈbeɪt/',pos:'verb',en:'To become less strong, intense, or severe.',hi:'कम होना / घटाना',hg:'Intensity ya strength ka kam ho jana.',mn:'A BEAR says: ABATE the storm!',st:'A huge BEAR makes a storm weak — the storm ABATES.',core:'Become less intense',sy:['lessen','diminish','subside'],an:['increase','intensify'],ex:'The heavy rain began to abate.',cf:['Abet','Abdicate']},
{w:'Benevolent',p:'/bəˈnevələnt/',pos:'adjective',en:'Kind, generous and willing to help others.',hi:'दयालु / परोपकारी',hg:'Dusron ki help aur bhalaai karne wala.',mn:'BEN + VOLUNTEER = BENEVOLENT',st:'BEN becomes a volunteer and gives gifts to everyone.',core:'Kind and generous',sy:['kind','charitable','generous'],an:['cruel','malevolent'],ex:'The benevolent officer helped the poor.',cf:['Malevolent','Beneficial']}];
function initialState(){return {words:DEFAULT_WORDS.map(x=>({...x})),index:0,correct:0,wrong:0,streak:0,learned:0,settings:{baseUrl:'https://router.bynara.id/v1',apiKey:'',apiUser:'Purendar',model:'qwen3.8-27b'}}}
let S;
try{const raw=localStorage.getItem('sscVocab');S=raw?JSON.parse(raw):null}catch(e){S=null}
if(!S||!Array.isArray(S.words)||!S.words.length)S=initialState();
S.correct=Number(S.correct)||0;S.wrong=Number(S.wrong)||0;S.streak=Number(S.streak)||0;S.learned=Number(S.learned)||0;S.index=Number(S.index)||0;S.settings=S.settings||initialState().settings;
const page=document.getElementById('page');
function save(){try{localStorage.setItem('sscVocab',JSON.stringify(S))}catch(e){}}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.add('hidden'),2400)}
function header(title,kicker,action){return '<div class="top"><div><div class="ey">'+kicker+'</div><h1>'+title+'</h1></div>'+(action||'')+'</div>'}
function navigate(name){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===name));({dashboard,learn,words,quiz,settings}[name]||dashboard)()}
function dashboard(){const n=S.words.length,m=Math.min(n,S.learned),pc=n?Math.round(m/n*100):0;page.innerHTML=header('Vocabulary Dashboard','SSC English','<button class="btn primary" id="start">+ Start Learning</button>')+'<div class="grid4"><div class="card stat"><span class="muted">Total Words</span><strong>'+n+'</strong><span class="muted">Vocabulary bank</span></div><div class="card stat"><span class="muted">Mastered</span><strong>'+m+'</strong><span class="muted">Active recall</span></div><div class="card stat"><span class="muted">Needs Revision</span><strong>'+S.wrong+'</strong><span class="muted">Priority words</span></div><div class="card stat"><span class="muted">Study Streak</span><strong>'+S.streak+'</strong><span class="muted">Consecutive answers</span></div></div><div class="grid2"><div class="card"><div class="head"><div><h2>Continue Learning</h2><span class="muted">Spaced repetition · active recall</span></div><span class="badge">'+pc+'%</span></div><div style="display:flex;justify-content:space-between;margin:20px 0 8px"><b>Vocabulary mastery</b><span class="muted">'+m+'/'+n+'</span></div><div class="progress"><i style="width:'+pc+'%"></i></div><div class="quick"><button data-go="learn"><b>Flashcards</b><small>Meaning + mnemonic</small></button><button data-go="quiz"><b>SSC Quiz</b><small>MCQ practice</small></button><button data-go="words"><b>Add Words</b><small>Build your bank</small></button></div></div><div class="card"><div class="head"><h2>Today\'s Focus</h2><span class="badge">AI Ready</span></div><p class="muted">Words you miss return sooner. Strengthen difficult words with AI-generated memory tricks.</p><div class="chips"><span class="chip">Active Recall</span><span class="chip">Spaced Repetition</span><span class="chip">Hindi + Hinglish</span><span class="chip">SSC MCQ</span><span class="chip">Confusion Words</span></div></div></div><div class="card" style="margin-top:16px"><div class="head"><h2>Recent Vocabulary</h2><button class="btn" data-go="words">View all</button></div><div class="rows">'+S.words.slice(-5).reverse().map(x=>'<div class="row"><div><b>'+esc(x.w)+'</b><div class="muted">'+esc(x.hi||'Hindi meaning')+'</div></div><span class="badge">'+esc(x.level||'New')+'</span></div>').join('')+'</div></div>';bindGo();document.getElementById('start').onclick=()=>navigate('learn')}
function learn(){if(!S.words.length){navigate('words');return}const x=S.words[S.index%S.words.length];page.innerHTML=header('Active Recall','LEARN WORDS','<span class="badge">'+(S.index%S.words.length+1)+' / '+S.words.length+'</span>')+'<div class="flash"><div class="flashcard"><div class="head"><span class="badge">'+esc(x.pos||'word')+'</span><span class="muted">Recall before reveal</span></div><div class="word">'+esc(x.w)+'</div><div class="pron">'+esc(x.p||'')+'</div><div class="recall"><b>Can you recall?</b><div class="muted">Meaning · synonym · antonym · memory trick · example</div></div><button class="btn primary" id="reveal" style="width:100%">Reveal Answer</button><div id="answer" class="hidden"><div class="details"><div class="info"><h3>Simple English</h3><p>'+esc(x.en)+'</p></div><div class="info"><h3>Hindi Meaning</h3><p>'+esc(x.hi)+'</p></div><div class="info"><h3>Hinglish</h3><p>'+esc(x.hg)+'</p></div><div class="info"><h3>Core Idea</h3><p><b>'+esc(x.core)+'</b></p></div><div class="info story"><h3>Phonetic Mnemonic</h3><p>'+esc(x.mn)+'</p></div><div class="info story"><h3>Visual Memory Story</h3><p>'+esc(x.st)+'</p></div><div class="info"><h3>Synonyms</h3><div class="chips">'+(x.sy||[]).map(a=>'<span class="chip">'+esc(a)+'</span>').join('')+'</div></div><div class="info"><h3>Antonyms</h3><div class="chips">'+(x.an||[]).map(a=>'<span class="chip">'+esc(a)+'</span>').join('')+'</div></div><div class="info"><h3>SSC Sentence</h3><p>'+esc(x.ex)+'</p></div><div class="info"><h3>Confusion Words</h3><div class="chips">'+(x.cf||[]).map(a=>'<span class="chip">'+esc(a)+'</span>').join('')+'</div></div></div><div class="rate"><button class="again" data-rate="w">↻ Again · Today</button><button data-rate="h">⚡ Difficult · Tomorrow</button><button class="got" data-rate="g">✓ Got it · 3 days</button></div><button class="btn primary" id="generate" style="width:100%;margin-top:10px">Generate / Strengthen with AI</button></div></div></div>';document.getElementById('reveal').onclick=()=>{document.getElementById('answer').classList.remove('hidden');document.getElementById('reveal').classList.add('hidden')};document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>rate(b.dataset.rate));document.getElementById('generate').onclick=generate}
function rate(k){if(k==='w'){S.wrong++;S.streak=0}else{S.correct++;S.streak++;if(k==='g')S.learned++}S.index++;save();learn()}
function words(){page.innerHTML=header('My Vocabulary','VOCABULARY BANK','<button class="btn primary" id="focusWords">+ Add Words</button>')+'<div class="card form"><label>Paste one or many words<textarea id="newWords" placeholder="abate\naberration\nbenevolent\nguile"></textarea></label><button class="btn primary" id="addWords">Add to Vocabulary</button></div><div class="card" style="margin-top:16px"><div class="rows">'+S.words.map(x=>'<div class="row"><div><b>'+esc(x.w)+'</b><div class="muted">'+esc(x.hi||'Hindi meaning')+' · '+esc(x.en||'Meaning pending')+'</div></div><span class="badge">'+esc(x.level||'New')+'</span></div>').join('')+'</div></div>';document.getElementById('focusWords').onclick=()=>document.getElementById('newWords').focus();document.getElementById('addWords').onclick=addWords}
function addWords(){const el=document.getElementById('newWords'),v=el.value.trim();if(!v)return;v.split(/[\n,]+/).map(x=>x.trim()).filter(Boolean).forEach(w=>S.words.push({w:w,pos:'word',en:'Meaning will be generated by AI.',hi:'Hindi meaning will be generated by AI.',hg:'',mn:'AI mnemonic pending',st:'AI visual story pending',core:'',sy:[],an:[],ex:'',cf:[],level:'New'}));save();toast('Vocabulary added');words()}
function quiz(){const x=S.words[S.index%S.words.length];let opts=[x.en].concat(S.words.filter(a=>a!==x).slice(0,3).map(a=>a.en));while(opts.length<4)opts.push('Another meaning');opts.sort(()=>Math.random()-.5);page.innerHTML=header('SSC Practice Quiz','EXAM MODE','<span class="badge">CGL · Meaning</span>')+'<div class="flash"><div class="card"><div class="ey">Question 01</div><div style="font-size:24px;font-weight:800;margin:10px 0 20px">What does <span style="color:#a895ff">'+esc(x.w)+'</span> mean?</div>'+opts.map((a,i)=>'<button class="option" data-answer="'+encodeURIComponent(a)+'"><b>'+String.fromCharCode(65+i)+'</b> · '+esc(a)+'</button>').join('')+'</div></div>';document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const a=decodeURIComponent(b.dataset.answer);if(a===x.en){S.correct++;S.streak++;b.style.borderColor='var(--green)';toast('Correct!')}else{S.wrong++;S.streak=0;b.style.borderColor='var(--red)';toast('Incorrect — revise this word.')}save()})}
function settings(){const s=S.settings;page.innerHTML=header('AI Configuration','PROVIDER','<span class="badge">Stored locally</span>')+'<div class="card form"><label>Base URL<input id="base" value="'+esc(s.baseUrl||'https://router.bynara.id/v1')+'"></label><div class="two"><label>API User<input id="apiUser" value="'+esc(s.apiUser||'Purendar')+'"></label><label>Model<input id="model" value="'+esc(s.model||'qwen3.8-27b')+'"></label></div><label>API Key<input id="apiKey" type="password" value="'+esc(s.apiKey||'')+'" placeholder="Enter API key"></label><button class="btn primary" id="saveSettings">Save Configuration</button><button class="btn" id="testAI">Test Connection</button><p class="muted">The browser sends AI requests through this app\'s Vercel proxy. The key is stored only in this browser.</p></div>';document.getElementById('saveSettings').onclick=saveSettings;document.getElementById('testAI').onclick=testAI}
function saveSettings(){S.settings={baseUrl:document.getElementById('base').value.trim().replace(/\/$/,''),apiUser:document.getElementById('apiUser').value.trim(),model:document.getElementById('model').value.trim(),apiKey:document.getElementById('apiKey').value.trim()};save();toast('AI configuration saved')}
async function proxy(payload){const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const text=await r.text();let d;try{d=JSON.parse(text)}catch(e){d={error:text}}if(!r.ok)throw new Error(d.error?.message||d.error||('HTTP '+r.status));return d}
async function testAI(){saveSettings();if(!S.settings.apiKey){toast('Enter an API key first');return}toast('Testing connection...');try{const d=await proxy({...S.settings,action:'models'});toast(Array.isArray(d.data)?'Connection successful':'Unexpected response')}catch(e){toast('Connection failed: '+e.message)}}
async function generate(){if(!S.settings.apiKey){navigate('settings');return}const x=S.words[S.index%S.words.length];toast('Generating AI card...');try{const d=await proxy({...S.settings,action:'chat',messages:[{role:'system',content:'Create accurate SSC CGL vocabulary data. Return ONLY JSON with pronunciation,pos,en,hi,hinglish,mnemonic,story,synonyms,antonyms,example,confusion.'},{role:'user',content:'Word: '+x.w}]});const raw=d.choices?.[0]?.message?.content||'';const j=JSON.parse(raw.replace(/^```json\s*|\s*```$/g,'').trim());Object.assign(x,{p:j.pronunciation||x.p,pos:j.pos||x.pos,en:j.en||x.en,hi:j.hi||x.hi,hg:j.hinglish||x.hg,mn:j.mnemonic||x.mn,st:j.story||x.st,sy:j.synonyms||x.sy,an:j.antonyms||x.an,ex:j.example||x.ex,cf:j.confusion||x.cf,level:'AI ready'});save();toast('AI card generated');learn()}catch(e){toast('AI generation failed: '+e.message)}}
function bindGo(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>navigate(b.dataset.go))}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>navigate(b.dataset.page));
try{navigate('dashboard')}catch(e){page.innerHTML='<div class="error"><b>App startup error</b><br>'+esc(e.message)+'<br><br>Refresh this page once.</div>';console.error(e)}
</script>
</body></html>
