<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b14"><title>SSC Vocabulary AI</title><style>:root{--bg:#070a12;--p:#101624;--p2:#151c2d;--p3:#1b2336;--t:#f7f8fc;--m:#8995ad;--a:#7657ff;--a2:#9b7cff;--g:#32d583;--r:#ff5f79;--l:#273149}*{box-sizing:border-box}body{margin:0;background:radial-gradient(800px 500px at 70% -10%,#3a267044,transparent 60%),var(--bg);color:var(--t);font:14px/1.55 Inter,system-ui,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:250px;position:fixed;height:100vh;padding:22px 15px;background:#090d17ee;border-right:1px solid var(--l);backdrop-filter:blur(18px)}.logo{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:900;padding:5px 10px 28px}.logo b{color:#a18bff}.mark{width:35px;height:35px;border-radius:11px;background:linear-gradient(135deg,#8062ff,#5435d0);display:grid;place-items:center}.label{font-size:10px;color:#59657d;letter-spacing:1.5px;text-transform:uppercase;padding:0 12px 8px}.nav{display:grid;gap:5px}.nav button{border:1px solid transparent;background:transparent;color:#8792aa;text-align:left;padding:12px;border-radius:11px}.nav button.active,.nav button:hover{background:var(--p2);color:white;border-color:#29334b}.bottom{position:absolute;bottom:18px;left:15px;right:15px;padding:11px;border:1px solid var(--l);background:var(--p);border-radius:12px}.main{margin-left:250px;width:calc(100% - 250px);max-width:1450px;padding:28px 38px 60px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.ey{font-size:10px;color:#7e8aa2;text-transform:uppercase;letter-spacing:1.5px}.top h1{font-size:28px;letter-spacing:-.7px;margin:2px 0}.badge{padding:6px 10px;border-radius:999px;background:#171f31;border:1px solid var(--l);color:#aeb8cb;font-size:11px}.btn{border:1px solid var(--l);background:var(--p2);color:white;padding:11px 15px;border-radius:10px}.primary{border:0;background:linear-gradient(135deg,#8062ff,#6847e8);color:white;font-weight:800;box-shadow:0 10px 25px #7657ff30}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:linear-gradient(145deg,#111827,#0e1422);border:1px solid var(--l);border-radius:16px;padding:18px;box-shadow:0 18px 55px #0005}.stat strong{display:block;font-size:29px;margin-top:7px}.muted{color:var(--m)}.layout{display:grid;grid-template-columns:1.45fr .85fr;gap:16px;margin-top:16px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.head h2{font-size:17px;margin:0}.progress{height:7px;background:#1a2132;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#7454ff,#a283ff)}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.quick button{text-align:left;border:1px solid var(--l);background:#131a2b;color:white;border-radius:12px;padding:14px}.quick b{display:block}.quick small{color:var(--m)}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:6px 9px;border-radius:999px;background:#1a2235;border:1px solid #283149;color:#c4cede;font-size:11px}.rows{display:grid}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #20283a}.row:last-child{border:0}.flash{max-width:900px;margin:auto}.flashcard{background:linear-gradient(150deg,#151c2d,#0d1320);border:1px solid #303a55;border-radius:22px;padding:28px;box-shadow:0 30px 90px #0009}.word{font-size:58px;line-height:1;font-weight:900;letter-spacing:-2px;margin:25px 0 4px}.pron{color:#a895ff}.recall{margin-top:25px;border:1px dashed #35415c;border-radius:13px;padding:14px}.answer{margin-top:20px}.agrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.info{background:#131b2c;border:1px solid var(--l);border-radius:12px;padding:14px}.info h3{margin:0 0 6px;font-size:11px;color:#9ba7bb;text-transform:uppercase;letter-spacing:.7px}.info p{margin:0}.story{background:linear-gradient(135deg,#211c42,#15182a);border-color:#3b3264}.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}.rate button{padding:12px;border-radius:10px;border:1px solid var(--l);background:var(--p2);color:white}.again{border-color:#633044!important}.got{border-color:#235c45!important;background:#11291f!important}.form{display:grid;gap:12px}.form label{display:grid;gap:7px;color:#9aa6bb;font-size:12px}.form input,.form textarea{background:#0b111d;border:1px solid var(--l);color:white;border-radius:10px;padding:12px;width:100%}.form textarea{min-height:145px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{display:block;width:100%;text-align:left;margin:9px 0;padding:14px;border:1px solid var(--l);background:#131a2a;color:white;border-radius:12px}.option:hover{border-color:#6651cf}.hidden{display:none}.toast{position:fixed;right:20px;bottom:20px;background:#171f31;border:1px solid #33405c;padding:12px 16px;border-radius:11px;z-index:20}@media(max-width:900px){.side{width:72px}.logoText,.label,.nav button span,.bottom{display:none}.logo{justify-content:center}.nav button{text-align:center}.main{margin-left:72px;width:calc(100% - 72px);padding:22px}.stats{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}}@media(max-width:600px){.side{display:none}.main{margin:0;width:100%;padding:16px}.stats,.quick,.agrid,.two,.rate{grid-template-columns:1fr 1fr}.word{font-size:44px}.top h1{font-size:22px}}
</style></head><body><div class="app"><aside class="side"><div class="logo"><div class="mark">S</div><div class="logoText">SSC <b>Vocab AI</b></div></div><div class="label">Workspace</div><nav class="nav"><button data-p="dashboard" class="active">⌂ <span>Dashboard</span></button><button data-p="learn">◈ <span>Learn Words</span></button><button data-p="words">☷ <span>My Vocabulary</span></button><button data-p="quiz">✓ <span>SSC Quiz</span></button><button data-p="settings">⚙ <span>AI Settings</span></button></nav><div class="bottom"><b>Purendar</b><div class="muted" style="font-size:11px">SSC CGL · AI Study</div></div></aside><main class="main"><div id="page"></div></main></div><div id="toast" class="toast hidden"></div><script>
const D=[{w:'Guile',p:'/ɡaɪl/',pos:'noun',en:'Sly or cunning intelligence used to deceive or trick someone.',hi:'छल-कपट / चालाकी',hg:'Chalaki se kisi ko trick ya deceive karna.',mn:'GUY + चालाक smile = GUILE',st:'Imagine a GUY with a clever smile secretly tricking everyone to win a prize.',core:'Clever deception',sy:['cunning','craft','deceit'],an:['honesty','sincerity'],ex:'He relied on guile rather than force.',cf:['Guilt','Gullible']},{w:'Abate',p:'/əˈbeɪt/',pos:'verb',en:'To become less strong, intense, or severe.',hi:'कम होना / घटाना',hg:'Intensity ya strength ka kam ho jana.',mn:'A BEAR says: “ABATE the storm!”',st:'A huge BEAR roars at a storm and makes it weak — the storm ABATES.',core:'Become less intense',sy:['lessen','diminish','subside'],an:['increase','intensify'],ex:'The heavy rain began to abate.',cf:['Abet','Abdicate']},{w:'Benevolent',p:'/bəˈnevələnt/',pos:'adjective',en:'Kind, generous and willing to help others.',hi:'दयालु / परोपकारी',hg:'Dusron ki help aur bhalaai karne wala.',mn:'BEN + VOLUNTEER = BENEVOLENT',st:'BEN becomes a volunteer and gives gifts to everyone — he is BENEVOLENT.',core:'Kind and generous',sy:['kind','charitable','generous'],an:['cruel','malevolent'],ex:'The benevolent officer helped the poor.',cf:['Malevolent','Beneficial']}];
let S=JSON.parse(localStorage.sscVocab||'null')||{words:D,index:0,correct:0,wrong:0,streak:0,learned:0,settings:{baseUrl:'https://router.bynara.id/v1',apiKey:'',apiUser:'Purendar',model:'qwen3.8-27b'}};if(!S.words?.length)S.words=D;const save=()=>localStorage.sscVocab=JSON.stringify(S),toast=x=>{let t=document.getElementById('toast');t.textContent=x;t.classList.remove('hidden');clearTimeout(window.t);window.t=setTimeout(()=>t.classList.add('hidden'),2300)},esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function top(a,b,c=''){return `<div class="top"><div><div class="ey">${b}</div><h1>${a}</h1></div>${c}</div>`}function go(p){document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.p===p));({dashboard,learn,words,quiz,settings}[p]||dashboard)()}
function dashboard(){let n=S.words.length,m=Math.min(n,S.learned||0),pc=n?Math.round(m/n*100):0;page.innerHTML=top('Vocabulary Dashboard','SSC English','<button class="btn primary" onclick="go(\'learn\')">+ Start Learning</button>')+`<div class="stats"><div class="card stat"><span class="muted">Total Words</span><strong>${n}</strong><span class="muted">Vocabulary bank</span></div><div class="card stat"><span class="muted">Mastered</span><strong>${m}</strong><span class="muted">Active recall</span></div><div class="card stat"><span class="muted">Needs Revision</span><strong>${S.wrong}</strong><span class="muted">Priority words</span></div><div class="card stat"><span class="muted">Study Streak</span><strong>${S.streak}</strong><span class="muted">Consecutive answers</span></div></div><div class="layout"><div class="card"><div class="head"><div><h2>Continue Learning</h2><span class="muted">Spaced repetition · active recall</span></div><span class="badge">${pc}%</span></div><div style="display:flex;justify-content:space-between;margin:20px 0 8px"><b>Vocabulary mastery</b><span class="muted">${m}/${n}</span></div><div class="progress"><i style="width:${pc}%"></i></div><div class="quick"><button onclick="go('learn')"><b>Flashcards</b><small>Meaning + mnemonic</small></button><button onclick="go('quiz')"><b>SSC Quiz</b><small>MCQ practice</small></button><button onclick="go('words')"><b>Add Words</b><small>Build your bank</small></button></div></div><div class="card"><div class="head"><h2>Today's Focus</h2><span class="badge">AI Ready</span></div><p class="muted">Words you miss return sooner. Strengthen difficult words with AI-generated memory tricks.</p><div class="chips"><span class="chip">Active Recall</span><span class="chip">Spaced Repetition</span><span class="chip">Hindi + Hinglish</span><span class="chip">SSC MCQ</span><span class="chip">Confusion Words</span></div></div></div><div class="card" style="margin-top:16px"><div class="head"><h2>Recent Vocabulary</h2><button class="btn" onclick="go('words')">View all</button></div><div class="rows">${S.words.slice(-5).reverse().map(x=>`<div class="row"><div><b>${esc(x.w)}</b><div class="muted">${esc(x.hi||'Hindi meaning')}</div></div><span class="badge">${esc(x.level||'New')}</span></div>`).join('')}</div></div>`}
function learn(){let x=S.words[S.index%S.words.length];page.innerHTML=top('Active Recall','LEARN WORDS',`<span class="badge">${S.index%S.words.length+1} / ${S.words.length}</span>`)+`<div class="flash"><div class="flashcard"><div class="head"><span class="badge">${esc(x.pos||'word')}</span><span class="muted">Recall before reveal</span></div><div class="word">${esc(x.w)}</div><div class="pron">${esc(x.p)}</div><div class="recall"><b>Can you recall?</b><div class="muted">Meaning · synonym · antonym · memory trick · example</div></div><button class="btn primary" style="width:100%;margin-top:14px" onclick="document.getElementById('ans').classList.remove('hidden')">Reveal Answer</button><div id="ans" class="answer hidden"><div class="agrid"><div class="info"><h3>Simple English</h3><p>${esc(x.en)}</p></div><div class="info"><h3>Hindi Meaning</h3><p>${esc(x.hi)}</p></div><div class="info"><h3>Hinglish</h3><p>${esc(x.hg)}</p></div><div class="info"><h3>Core Idea</h3><p><b>${esc(x.core)}</b></p></div><div class="info story"><h3>Phonetic Mnemonic</h3><p>${esc(x.mn)}</p></div><div class="info story"><h3>Visual Memory Story</h3><p>${esc(x.st)}</p></div><div class="info"><h3>Synonyms</h3><div class="chips">${x.sy.map(a=>`<span class="chip">${esc(a)}</span>`).join('')}</div></div><div class="info"><h3>Antonyms</h3><div class="chips">${x.an.map(a=>`<span class="chip">${esc(a)}</span>`).join('')}</div></div><div class="info"><h3>SSC Sentence</h3><p>${esc(x.ex)}</p></div><div class="info"><h3>Confusion Words</h3><div class="chips">${x.cf.map(a=>`<span class="chip">${esc(a)}</span>`).join('')}</div></div></div><div class="rate"><button class="again" onclick="rate('w')">↻ Again · Today</button><button onclick="rate('h')">⚡ Difficult · Tomorrow</button><button class="got" onclick="rate('g')">✓ Got it · 3 days</button></div><button class="btn primary" style="width:100%;margin-top:10px" onclick="generate()">Generate / Strengthen with AI</button></div></div></div>`}
function rate(k){k==='w'?(S.wrong++,S.streak=0):(S.correct++,S.streak++,k==='g'&&S.learned++);S.index++;save();learn()}
function words(){page.innerHTML=top('My Vocabulary','VOCABULARY BANK','<button class="btn primary" onclick="document.getElementById(\'nw\').focus()">+ Add Words</button>')+`<div class="card"><div class="form"><label>Paste one or many words<textarea id="nw" placeholder="abate\naberration\nbenevolent\nguile"></textarea></label><button class="btn primary" onclick="addWords()">Add to Vocabulary</button></div></div><div class="card" style="margin-top:16px"><div class="rows">${S.words.map(x=>`<div class="row"><div><b>${esc(x.w)}</b><div class="muted">${esc(x.hi||'Hindi meaning')} · ${esc(x.en||'Meaning pending')}</div></div><span class="badge">${esc(x.level||'New')}</span></div>`).join('')}</div></div>`}
function addWords(){let v=document.getElementById('nw').value.trim();if(!v)return;v.split(/[,\n]+/).map(x=>x.trim()).filter(Boolean).forEach(w=>S.words.push({w,pos:'word',en:'Meaning will be generated by AI.',hi:'Hindi meaning will be generated by AI.',hg:'',mn:'AI mnemonic pending',st:'AI visual story pending',core:'',sy:[],an:[],ex:'',cf:[],level:'New'}));save();toast('Vocabulary added');words()}
function quiz(){let x=S.words[S.index%S.words.length],o=[x.en,...S.words.filter(a=>a!==x).slice(0,3).map(a=>a.en)];while(o.length<4)o.push('Another meaning');o.sort(()=>Math.random()-.5);page.innerHTML=top('SSC Practice Quiz','EXAM MODE','<span class="badge">CGL · Meaning</span>')+`<div class="flash"><div class="card"><div class="ey">Question 01</div><div style="font-size:24px;font-weight:800;margin:10px 0 20px">What does <span style="color:#a895ff">${esc(x.w)}</span> mean?</div>${o.map((a,i)=>`<button class="option" onclick="this.style.borderColor=${JSON.stringify(a===x.en?'#32d583':'#ff5f79')};toast(${JSON.stringify(a===x.en?'Correct!':'Incorrect — revise this word.')});${a===x.en?'S.correct++':'S.wrong++'};save()"><b>${String.fromCharCode(65+i)}</b> · ${esc(a)}</button>`).join('')}</div></div>`}
function settings(){let s=S.settings;page.innerHTML=top('AI Configuration','PROVIDER','<span class="badge">Stored locally</span>')+`<div class="card form"><label>Base URL<input id="base" value="${esc(s.baseUrl)}"></label><div class="two"><label>API User<input id="user" value="${esc(s.apiUser)}"></label><label>Model<input id="model" value="${esc(s.model)}"></label></div><label>API Key<input id="key" type="password" value="${esc(s.apiKey)}" placeholder="Enter API key"></label><button class="btn primary" onclick="saveSet()">Save Configuration</button><button class="btn" onclick="testAI()">Test Connection</button><p class="muted">The browser calls this app's Vercel proxy. Your API key remains in this browser and is never committed to GitHub.</p></div>`}
function saveSet(){S.settings={baseUrl:base.value.trim().replace(/\/$/,''),apiUser:user.value.trim(),model:model.value.trim(),apiKey:key.value.trim()};save();toast('AI configuration saved')}
async function proxy(p){let r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)}),t=await r.text(),d;try{d=JSON.parse(t)}catch{d={error:t}}if(!r.ok)throw Error(d.error?.message||d.error||r.status);return d}async function testAI(){saveSet();let s=S.settings;if(!s.apiKey)return toast('Enter an API key first');toast('Testing connection...');try{let d=await proxy({baseUrl:s.baseUrl,apiKey:s.apiKey,apiUser:s.apiUser,action:'models'});toast(Array.isArray(d.data)?'Connection successful':'Unexpected response')}catch(e){toast('Connection failed: '+e.message)}}async function generate(){let s=S.settings,x=S.words[S.index%S.words.length];if(!s.apiKey)return go('settings');toast('Generating AI card...');try{let d=await proxy({baseUrl:s.baseUrl,apiKey:s.apiKey,apiUser:s.apiUser,action:'chat',model:s.model,messages:[{role:'system',content:'Create accurate SSC CGL vocabulary cards. Return ONLY JSON with pronunciation,pos,en,hi,hinglish,mnemonic,story,synonyms,antonyms,example,confusion.'},{role:'user',content:'Word: '+x.w}]});let j=JSON.parse((d.choices?.[0]?.message?.content||'').replace(/^```json\s*|\s*```$/g,'').trim());Object.assign(x,{p:j.pronunciation||x.p,pos:j.pos||x.pos,en:j.en||x.en,hi:j.hi||x.hi,hg:j.hinglish||x.hg,mn:j.mnemonic||x.mn,st:j.story||x.st,sy:j.synonyms||x.sy,an:j.antonyms||x.an,ex:j.example||x.ex,cf:j.confusion||x.cf,level:'AI ready'});save();toast('AI card generated');learn()}catch(e){toast('AI generation failed: '+e.message)}}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.p));go('dashboard');</script></body></html>
