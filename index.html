<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b14"><title>SSC Vocabulary AI</title>
<style>
:root{--bg:#080b14;--panel:#111727;--panel2:#171e31;--text:#f5f7fb;--muted:#9ca8bd;--accent:#7c5cff;--good:#32d583;--bad:#ff647c;--line:#273149}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#1b1640,#080b14 40%);color:var(--text);font-family:Inter,system-ui,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:245px;background:#0b0f1b;border-right:1px solid var(--line);padding:22px 15px;position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:800;padding:8px 10px 22px}.brand span{color:#8b74ff}.nav{display:grid;gap:6px}.nav button{background:transparent;border:0;color:var(--muted);text-align:left;padding:12px;border-radius:10px}.nav button.active,.nav button:hover{background:var(--panel2);color:white}.main{flex:1;max-width:1250px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.top h1{margin:0;font-size:28px}.badge,.pill{padding:6px 10px;border-radius:999px;background:#171d30;border:1px solid var(--line);color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:linear-gradient(145deg,#12192a,#0f1524);border:1px solid var(--line);border-radius:16px;padding:18px}.stat b{display:block;font-size:28px;margin-top:7px}.muted{color:var(--muted)}.section{margin-top:22px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.quick button,.primary{border:0;border-radius:12px;padding:15px;background:var(--accent);color:white;font-weight:700}.secondary{background:var(--panel2)!important;border:1px solid var(--line)!important}.flash{max-width:800px;margin:20px auto}.word{font-size:48px;font-weight:850;margin:10px 0}.pron{color:#a99cff}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:6px 9px;border-radius:999px;background:#1b2337;color:#c9d2e5;font-size:12px}.answer{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.actions button{border:1px solid var(--line);background:var(--panel2);color:white;padding:11px 16px;border-radius:10px}.good{border-color:#226d4c!important;background:#123325!important}.bad{border-color:#713040!important;background:#331722!important}.form{display:grid;gap:13px;max-width:850px}.form label{display:grid;gap:7px;color:var(--muted);font-size:13px}.form input,.form textarea{background:#0c1220;border:1px solid var(--line);color:white;border-radius:10px;padding:12px}.form textarea{min-height:120px}.wordrow{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.hidden{display:none}.toast{position:fixed;right:18px;bottom:18px;background:#171f32;border:1px solid var(--line);padding:12px 15px;border-radius:10px;box-shadow:0 18px 55px #0007;z-index:10}@media(max-width:800px){.side{width:68px;padding:12px 7px}.brand{font-size:0}.brand span{font-size:20px}.nav button{font-size:0;text-align:center}.nav button:first-letter{font-size:18px}.main{padding:18px}.grid{grid-template-columns:1fr 1fr}.quick{grid-template-columns:1fr}.word{font-size:38px}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand">SSC <span>Vocab AI</span></div><nav class="nav"><button data-page="dashboard">⌂ &nbsp; Dashboard</button><button data-page="learn">▣ &nbsp; Learn</button><button data-page="words">☷ &nbsp; My Words</button><button data-page="quiz">✓ &nbsp; Quiz</button><button data-page="settings">⚙ &nbsp; AI Settings</button></nav></aside><main class="main"><div id="page"></div></main></div><div id="toast" class="toast hidden"></div>
<script>
const defaults=[
{w:'Guile',p:'/ɡaɪl/',pos:'noun',en:'Sly or cunning intelligence used to deceive or trick someone.',hi:'छल-कपट / चालाकी',hinglish:'Chalaki se kisi ko trick karna.',syn:['cunning','deceit','craft'],ant:['honesty','sincerity'],story:'A GUY uses a guileful smile to trick everyone.',ex:'He relied on guile rather than force.',level:'New'},
{w:'Abate',p:'/əˈbeɪt/',pos:'verb',en:'To become less strong, intense, or severe.',hi:'कम होना / घटाना',hinglish:'Intensity ya strength ka kam hona.',syn:['lessen','diminish','subside'],ant:['increase','intensify'],story:'A BEAR says: “ABATE the storm!” and the storm becomes weak.',ex:'The heavy rain began to abate.',level:'New'},
{w:'Benevolent',p:'/bəˈnevələnt/',pos:'adjective',en:'Kind, generous and willing to help others.',hi:'दयालु / परोपकारी',hinglish:'Dusron ki help karne wala kind person.',syn:['kind','charitable','generous'],ant:['cruel','malevolent'],story:'BEN gives everyone gifts: BEN + volunteer = benevolent.',ex:'The benevolent officer helped the poor.',level:'New'}];
let state=JSON.parse(localStorage.sscVocab||'null')||{words:defaults,index:0,correct:0,wrong:0,streak:0,settings:{baseUrl:'https://router.bynara.id/v1',apiKey:'',apiUser:'',model:'qwen3.8-27b'}};
const save=()=>localStorage.sscVocab=JSON.stringify(state);const toast=x=>{let t=document.getElementById('toast');t.textContent=x;t.classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.add('hidden'),2500)};const shell=h=>document.getElementById('page').innerHTML=h;
function dashboard(){shell(`<div class="top"><div><div class="muted">SSC English</div><h1>Vocabulary Dashboard</h1></div><span class="badge">AI Flashcards</span></div><div class="grid"><div class="card stat"><span class="muted">Total words</span><b>${state.words.length}</b></div><div class="card stat"><span class="muted">Correct</span><b>${state.correct}</b></div><div class="card stat"><span class="muted">Needs revision</span><b>${state.wrong}</b></div><div class="card stat"><span class="muted">Streak</span><b>${state.streak}</b></div></div><div class="section"><h2>Start learning</h2><div class="quick"><button onclick="go('learn')">Start Flashcards</button><button class="secondary" onclick="go('quiz')">Take SSC Quiz</button><button class="secondary" onclick="go('words')">Manage Vocabulary</button></div></div><div class="section card"><h2>Smart Memory System</h2><p class="muted">Active recall, spaced revision, Hindi + Hinglish explanations, SSC-style practice and AI mnemonic generation.</p><div class="chips"><span class="chip">Active Recall</span><span class="chip">Spaced Repetition</span><span class="chip">AI Mnemonics</span><span class="chip">SSC MCQ</span></div></div>`)}
function learn(){if(!state.words.length)return words();let x=state.words[state.index%state.words.length];shell(`<div class="top"><div><div class="muted">Flashcard ${state.index%state.words.length+1}/${state.words.length}</div><h1>Active Recall</h1></div><span class="badge">${x.level||'New'}</span></div><div class="flash card"><div class="muted">${x.pos||'word'}</div><div class="word">${x.w}</div><div class="pron">${x.p||''}</div><p class="muted">Recall meaning, synonym, antonym and memory trick before revealing.</p><button class="primary" onclick="reveal()">Reveal Answer</button><div id="answer" class="answer hidden"><h3>Simple English</h3><p>${x.en}</p><h3>Hindi</h3><p>${x.hi}</p><h3>Hinglish</h3><p>${x.hinglish||''}</p><h3>Memory Story</h3><p>${x.story}</p><h3>Synonyms</h3><div class="chips">${(x.syn||[]).map(a=>`<span class="chip">${a}</span>`).join('')}</div><h3>Antonyms</h3><div class="chips">${(x.ant||[]).map(a=>`<span class="chip">${a}</span>`).join('')}</div><h3>SSC-style sentence</h3><p>${x.ex||''}</p><div class="actions"><button class="bad" onclick="rate(false)">Again</button><button onclick="rate(true)">Difficult</button><button class="good" onclick="rate(true)">Got it</button></div></div></div>`)}
function reveal(){document.getElementById('answer').classList.remove('hidden')}function rate(ok){ok?(state.correct++,state.streak++):(state.wrong++,state.streak=0);state.index++;save();learn()}
function words(){shell(`<div class="top"><div><div class="muted">Vocabulary Bank</div><h1>My Words</h1></div></div><div class="card form"><label>Add one or many words<textarea id="newWords" placeholder="abate\naberration\nbenevolent"></textarea></label><button class="primary" onclick="addWords()">Add Vocabulary</button></div><div class="section card">${state.words.map(x=>`<div class="wordrow"><div><b>${x.w}</b><div class="muted">${x.hi} · ${x.en}</div></div><span class="pill">${x.level||'New'}</span></div>`).join('')}</div>`)}
function addWords(){let v=document.getElementById('newWords').value.trim();if(!v)return;v.split(/[,\n]+/).map(s=>s.trim()).filter(Boolean).forEach(w=>state.words.push({w,p:'',pos:'',en:'Meaning not generated yet.',hi:'Hindi meaning not generated yet.',hinglish:'',syn:[],ant:[],story:'Generate this card with AI.',ex:'',level:'New'}));save();toast('Words added');words()}
function quiz(){if(!state.words.length)return words();let x=state.words[state.index%state.words.length],others=state.words.filter(a=>a!==x).slice(0,3).map(a=>a.en),opts=[x.en,...others].sort(()=>Math.random()-.5);shell(`<div class="top"><div><div class="muted">SSC Practice</div><h1>Meaning MCQ</h1></div><span class="badge">1 question</span></div><div class="card flash"><h2>What does <b>${x.w}</b> mean?</h2>${opts.map((o,i)=>`<button class="actions" style="width:100%;margin:8px 0;text-align:left" onclick="quizAnswer(this,${JSON.stringify(o===x.en)})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div>`)}
function quizAnswer(btn,ok){btn.style.borderColor=ok?'#32d583':'#ff647c';toast(ok?'Correct!':'Incorrect — revise this word.');ok?state.correct++:state.wrong++;save()}
function settings(){let s=state.settings;shell(`<div class="top"><div><div class="muted">Provider</div><h1>AI Configuration</h1></div><span class="badge">Stored locally</span></div><div class="card form"><label>Base URL<input id="base" value="${s.baseUrl}"></label><label>API User<input id="user" value="${s.apiUser}"></label><label>Model<input id="model" value="${s.model}"></label><label>API Key<input id="key" type="password" value="${s.apiKey}" placeholder="sk-nry-..."></label><button class="primary" onclick="saveSettings()">Save Configuration</button><button class="secondary" onclick="testAI()">Test Connection</button><p class="muted">The browser now calls this app's secure Vercel proxy, which forwards the request to NaraRouter. Your key is not stored on the server.</p></div>`)}
function saveSettings(){state.settings={baseUrl:document.getElementById('base').value.trim().replace(/\/$/,''),apiUser:document.getElementById('user').value.trim(),model:document.getElementById('model').value.trim(),apiKey:document.getElementById('key').value.trim()};save();toast('AI configuration saved')}
async function proxy(payload){let r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});let text=await r.text();let data;try{data=JSON.parse(text)}catch{data={error:text}}if(!r.ok)throw new Error(data?.error?.message||data?.error||('HTTP '+r.status));return data}
async function testAI(){saveSettings();let s=state.settings;if(!s.apiKey){toast('Enter an API key first');return}toast('Testing connection...');try{let d=await proxy({baseUrl:s.baseUrl,apiKey:s.apiKey,apiUser:s.apiUser,action:'models'});toast(Array.isArray(d.data)?'Connection successful':'Connected, but unexpected response')}catch(e){toast('Connection failed: '+e.message)}}
async function generateCurrent(){let s=state.settings;if(!s.apiKey){toast('Configure API key first');go('settings');return}let x=state.words[state.index%state.words.length];toast('Generating AI card...');try{let d=await proxy({baseUrl:s.baseUrl,apiKey:s.apiKey,apiUser:s.apiUser,action:'chat',model:s.model,messages:[{role:'system',content:'You create accurate SSC CGL English vocabulary flashcards. Return ONLY valid JSON with keys: pronunciation,pos,en,hi,hinglish,mnemonic,story,synonyms,antonyms,example,confusion,mcq,cloze,reverse,oneSecond.'},{role:'user',content:'Create a complete card for the word: '+x.w}]});let text=d.choices?.[0]?.message?.content||'';text=text.replace(/^```json\s*|\s*```$/g,'').trim();let j=JSON.parse(text);Object.assign(x,{p:j.pronunciation||x.p,pos:j.pos||x.pos,en:j.en||x.en,hi:j.hi||x.hi,hinglish:j.hinglish||x.hinglish,story:j.story||j.mnemonic||x.story,syn:j.synonyms||x.syn,ant:j.antonyms||x.ant,ex:j.example||x.ex,level:'AI ready'});save();toast('AI card generated');learn()}catch(e){toast('AI generation failed: '+e.message)}}
function go(p){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));({dashboard,learn,words,quiz,settings}[p]||dashboard)()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));
const oldLearn=learn;learn=function(){oldLearn();if(document.querySelector('.flash')){let a=document.querySelector('.flash .actions');if(a)a.insertAdjacentHTML('afterend','<button class="primary" style="margin-top:12px" onclick="generateCurrent()">Generate / Strengthen with AI</button>')}};go('dashboard');
</script></body></html>
