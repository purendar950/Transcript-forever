<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyPlanner — SSC Vocabulary</title></head><body><script>
(async()=>{
  const source='https://raw.githubusercontent.com/purendar950/Transcript-forever/69298cd161d864220e93700978f196f2886c8e1c/index.html';
  try{
    let html=await (await fetch(source,{cache:'no-store'})).text();
    const old="document.getElementById('answerBox').innerHTML='<strong>Correct Answer:</strong> '+String.fromCharCode(65+d.ans)+'. '+d.opts[d.ans];";
    const fixed="document.getElementById('answerBox').innerHTML='<span style=\"color:#6a7180\">Select an option to reveal the answer.</span>';document.querySelectorAll('#opts input').forEach((el,n)=>el.addEventListener('change',()=>{const correct=n===d.ans;document.getElementById('answerBox').innerHTML=(correct?'<strong style=\"color:#21964c\">Correct!</strong> ':'<strong style=\"color:#df4d68\">Incorrect.</strong> ')+'Correct Answer: '+String.fromCharCode(65+d.ans)+'. '+d.opts[d.ans]}));";

    document.open();document.write(html);document.close();
  }catch(e){document.body.innerHTML='<p style="font:16px system-ui;padding:30px">Unable to load the vocabulary app. Please refresh.</p>';console.error(e)}
})();
</script></body></html>
