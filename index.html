<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyPlanner — SSC Vocabulary</title></head><body><script>
(async()=>{
const source='https://raw.githubusercontent.com/purendar950/Transcript-forever/69298cd161d864220e93700978f196f2886c8e1c/index.html';
try{
 const r=await fetch(source,{cache:'no-store'}); if(!r.ok) throw new Error('Vocabulary source HTTP '+r.status); let html=await r.text();
 html=html.replace('</head>','<style>.topbar{display:none!important}.aiAddBtn{padding:9px 16px;border:0;border-radius:7px;background:linear-gradient(90deg,#6724e8,#7b2bf0);color:#fff;font-weight:800;cursor:pointer}.aiModal{position:fixed;inset:0;background:#1118;z-index:99999;display:none;align-items:center;justify-content:center;padding:18px}.aiModal.show{display:flex}.aiBox{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:14px;padding:24px;box-shadow:0 20px 70px #0005}.aiBox h2{margin:0 0 5px;color:#2b215f}.aiBox label{display:block;font-weight:700;margin-top:13px}.aiBox input{width:100%;margin-top:6px;padding:11px;border:1px solid #ccd1dc;border-radius:7px;font:inherit}.aiRow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.aiActions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}.aiResult{margin-top:15px;padding:13px;border:1px solid #ddd;border-radius:8px;background:#faf9ff}.aiStatus{margin-top:10px;font-weight:700}.aiSmall{font-size:12px;color:#687080}@media(max-width:600px){.aiRow{grid-template-columns:1fr}}</style></head>');
 const old="document.getElementById('answerBox').innerHTML='<strong>Correct Answer:</strong> '+String.fromCharCode(65+d.ans)+'. '+d.opts[d.ans];";
 const fixed="document.getElementById('answerBox').innerHTML='<span style=\"color:#6a7180\">Select an option to reveal the answer.</span>';document.querySelectorAll('#opts input').forEach((el,n)=>el.addEventListener('change',()=>{const correct=n===d.ans;document.getElementById('answerBox').innerHTML=(correct?'<strong style=\"color:#21964c\">Correct!</strong> ':'<strong style=\"color:#df4d68\">Incorrect.</strong> ')+'Correct Answer: '+String.fromCharCode(65+d.ans)+'. '+d.opts[d.ans]}));";
 if(html.includes(old)) html=html.replace(old,fixed);
 html=html.replace(/<div class="bottomgrid">[\s\S]*?<\/div><\/article>/,'</article>');
 html=html.replace(/<div class="block"><h3>Cloze Test<\/h3>[\s\S]*?<\/div><div class="block"><h3>Reverse Recall<\/h3>[\s\S]*?<\/div>/,'');
 html=html.replace(/for\(let k of \['word','pron','posTag','meaning','hindi','hinglish','visual','example','mnemonic','story','core','pyq','source','q','cloze','reverse'\]\)/,"for(let k of ['word','pron','posTag','meaning','hindi','hinglish','visual','example','mnemonic','story','core','q'])");
 html=html.replace(/const DATA\s*=\s*\[/,"const DATA=[...(()=>{try{return JSON.parse(localStorage.getItem('sscAIWords')||'[]')}catch(e){return []}})(),");
 html=html.replace('<h1>Flashcard</h1>','<h1>Flashcard</h1><button class="aiAddBtn" onclick="openAIAdd()">+ Add Word with AI</button>');
 const modal='<div id="aiModal" class="aiModal"><div class="aiBox"><h2>Add New Word with AI</h2><div class="aiSmall">Enter one word or comma-separated words. AI creates an SSC-focused learning card.</div><label>Word(s)<input id="aiWords" placeholder="e.g. guile, abnegate, perfidious"></label><div class="aiRow"><label>Base URL<input id="aiBase" value="https://router.bynara.id/v1"></label><label>Model<input id="aiModel" value="qwen3.8-27b"></label></div><div class="aiRow"><label>API User<input id="aiUser" value="Purendar"></label><label>API Key<input id="aiKey" type="password" placeholder="Your API key"></label></div><div class="aiActions"><button onclick="closeAIAdd()">Cancel</button><button class="aiAddBtn" id="aiGenerate" onclick="generateAIWord()">Generate & Add</button></div><div id="aiStatus" class="aiStatus"></div><div id="aiResult" class="aiResult" style="display:none"></div></div></div>';
 const js=`function openAIAdd(){document.getElementById('aiModal').classList.add('show');document.getElementById('aiWords').focus()}\nfunction closeAIAdd(){document.getElementById('aiModal').classList.remove('show')}\nasync function generateAIWord(){const words=document.getElementById('aiWords').value.trim(),baseUrl=document.getElementById('aiBase').value.trim(),model=document.getElementById('aiModel').value.trim(),apiUser=document.getElementById('aiUser').value.trim(),apiKey=document.getElementById('aiKey').value.trim(),status=document.getElementById('aiStatus'),result=document.getElementById('aiResult'),btn=document.getElementById('aiGenerate');if(!words||!apiKey){status.textContent='Enter word(s) and API key.';return}status.textContent='Generating SSC vocabulary card...';result.style.display='none';btn.disabled=true;try{const prompt='Create SSC English vocabulary flashcard data for these word(s): '+words+'. Return ONLY valid JSON array. Each object must have exactly: word, pron, pos, meaning, hindi, hinglish, visual, syn, ant, example, mnemonic, story, core, q, opts, ans, confuse. syn and ant: arrays of 3 strings. opts: 4 strings. ans: zero-based integer. confuse: exactly 2 objects with word and meaning. Make meanings accurate and exam-focused. Do not invent PYQ claims or sources.';const rr=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({baseUrl,apiKey,apiUser,action:'chat',model,messages:[{role:'system',content:'You are an expert SSC English vocabulary teacher. Output strict JSON only.'},{role:'user',content:prompt}]})});const j=await rr.json();if(!rr.ok)throw new Error(j.error||j.message||'AI request failed');let text=j.choices?.[0]?.message?.content||'';text=text.replace(/^\\s*\\`\\`\\`(?:json)?/i,'').replace(/\\`\\`\\`\\s*$/,'').trim();const data=JSON.parse(text);if(!Array.isArray(data)||!data.length)throw new Error('AI returned no vocabulary data.');const clean=data.map(d=>({word:String(d.word||'').trim(),pron:String(d.pron||''),pos:String(d.pos||'Noun'),meaning:String(d.meaning||''),hindi:String(d.hindi||''),hinglish:String(d.hinglish||''),visual:String(d.visual||'📚'),syn:Array.isArray(d.syn)?d.syn.slice(0,3):[],ant:Array.isArray(d.ant)?d.ant.slice(0,3):[],example:String(d.example||''),mnemonic:String(d.mnemonic||''),story:String(d.story||''),core:String(d.core||''),q:String(d.q||('Choose the closest meaning of '+d.word+'.')),opts:Array.isArray(d.opts)?d.opts.slice(0,4):[],ans:Number.isInteger(d.ans)?d.ans:0,confuse:Array.isArray(d.confuse)?d.confuse.slice(0,2):[]})).filter(d=>d.word);const old=JSON.parse(localStorage.getItem('sscAIWords')||'[]');localStorage.setItem('sscAIWords',JSON.stringify([...old,...clean]));result.innerHTML='<strong>Added:</strong> '+clean.map(d=>d.word).join(', ')+'<br><span class="aiSmall">Saved to your vocabulary. Reloading...</span>';result.style.display='block';status.textContent='Success';setTimeout(()=>location.reload(),900)}catch(e){status.textContent='Error: '+e.message}finally{btn.disabled=false}}`;
 const tag='<scr'+'ipt>'+js+'</scr'+'ipt>';
 html=html.replace('</body>',modal+tag+'</body>'); document.open();document.write(html);document.close();
}catch(e){document.body.innerHTML='<p style="font:16px system-ui;padding:30px">Unable to load the vocabulary app.<br><small>'+String(e.message||e)+'</small></p>';console.error(e)}})();
</script></body></html>
